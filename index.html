<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#100d0a" />
  <title>CNN Fear & Greed + QQQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #100d0a;
      --card: rgba(32, 24, 16, .78);
      --line: rgba(228, 195, 122, .18);
      --text: #f7f0e4;
      --muted: #b7a894;
      --gold: #e4c37a;
      --ink: #1a140e;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      color: var(--text);
      font-family: Outfit, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background:
        radial-gradient(900px 420px at 10% -10%, rgba(228,195,122,.16), transparent 55%),
        radial-gradient(700px 380px at 110% 8%, rgba(201,92,58,.12), transparent 50%),
        linear-gradient(180deg, #17120c 0%, #100d0a 42%, #0c0a08 100%);
    }
    body {
      padding: calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    h1 {
      font-size: 13px; font-weight: 600; margin: 0;
      letter-spacing: .16em; color: var(--gold);
    }
    .sub { font-size: 12px; color: var(--muted); margin-top: 6px; letter-spacing: .01em; }
    button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.03);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
    }
    button:active { transform: scale(.98); }
    .search {
      margin-top: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 18px 40px rgba(0,0,0,.22);
      backdrop-filter: blur(16px);
    }
    .search-row { display: flex; gap: 8px; }
    .search input[type=date],
    .search input[type=search] {
      flex: 1; min-width: 0;
      background: rgba(12,10,8,.65);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 13px;
      font-size: 16px;
      font-family: inherit;
    }
    .search .actions { display: flex; gap: 8px; margin-top: 8px; }
    .search .actions button { flex: 1; }
    #searchBtn {
      background: linear-gradient(180deg, #ead09a 0%, #c9a25a 100%);
      color: #2a1f12;
      border-color: transparent;
    }
    .note { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 16px; }
    .hero {
      margin-top: 16px;
      background:
        linear-gradient(180deg, rgba(228,195,122,.10) 0%, rgba(32,24,16,.55) 34%, rgba(22,17,12,.88) 100%);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 26px 20px 18px;
      text-align: center;
      box-shadow: 0 24px 50px rgba(0,0,0,.28);
    }
    .score {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 92px;
      line-height: .88;
      font-weight: 400;
      letter-spacing: -2px;
    }
    .rating {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: .04em;
    }
    .meta { margin-top: 12px; color: var(--muted); font-size: 13px; }
    .bar-wrap { margin: 24px 6px 6px; }
    .bar {
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #d4524a 0%, #e0893a 28%, #e4c37a 50%, #8fbf6a 76%, #3f9d6a 100%);
      position: relative;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.25);
    }
    .needle {
      position: absolute;
      top: -7px;
      width: 3px;
      height: 24px;
      background: #fff8ea;
      border-radius: 4px;
      transform: translateX(-50%);
      box-shadow: 0 0 0 4px rgba(16,13,10,.45);
    }
    .labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--muted); }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 18px; }
    .stat {
      background: rgba(12,10,8,.45);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 8px;
    }
    .stat b { display: block; font-size: 17px; margin-top: 4px; font-weight: 600; }
    .stat span { font-size: 11px; color: var(--muted); letter-spacing: .02em; }
    canvas { width: 100%; height: 140px; margin-top: 18px; }
    .list { margin-top: 22px; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 13px 6px;
      border-bottom: 1px solid rgba(228,195,122,.08);
      font-size: 14px;
    }
    .row.active {
      background: rgba(228,195,122,.08);
      margin: 0 -8px;
      padding-left: 14px;
      padding-right: 14px;
      border-radius: 14px;
      border-bottom-color: transparent;
    }
    .qqq-line { margin-top: 4px; font-size: 12px; color: var(--muted); }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .err {
      margin-top: 20px;
      background: rgba(90,28,28,.35);
      border: 1px solid rgba(220,120,120,.35);
      color: #ffd5d5;
      padding: 14px;
      border-radius: 16px;
      font-size: 14px;
    }
    .hint { margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.55; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>FEAR & GREED + QQQ</h1>
        <div class="sub">날짜별 지수 · QQQ 종가 · RSI(14)</div>
      </div>
      <button id="reload" type="button">새로고침</button>
    </header>
    <div class="search">
      <div class="search-row">
        <input id="datePick" type="date" />
        <input id="dateText" type="search" inputmode="numeric" placeholder="예: 2024-03-15" />
      </div>
      <div class="actions">
        <button id="searchBtn" type="button">이 날짜 보기</button>
        <button id="todayBtn" type="button">최신 날짜</button>
      </div>
      <div class="note" id="note"></div>
    </div>
    <div id="app"><p class="hint">불러오는 중…</p></div>
  </div>
  <script src="https://raw.githubusercontent.com/NinetysevenD11/fear-greed-app/main/app.js"></script>
</body>
</html>
