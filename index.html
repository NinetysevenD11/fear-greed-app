<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fear & Greed" />
  <link rel="manifest" href="manifest.json" />
  <title>CNN Fear & Greed</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #151b2e;
      --line: #2a3350;
      --text: #f4f6fb;
      --muted: #9aa3b8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      min-height: 100%;
    }
    body {
      padding: calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .02em; color: var(--muted); }
    .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    button {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
    }
    .search {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
    }
    .search-row { display: flex; gap: 8px; }
    .search input[type="date"],
    .search input[type="search"] {
      flex: 1;
      min-width: 0;
      background: #101628;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 16px;
    }
    .search .actions { display: flex; gap: 8px; margin-top: 8px; }
    .search .actions button { flex: 1; }
    .note { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 16px; }
    .hero {
      margin-top: 16px;
      background: linear-gradient(180deg, #1a2238 0%, var(--card) 100%);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 22px 20px 18px;
      text-align: center;
    }
    .score { font-size: 84px; line-height: 1; font-weight: 800; letter-spacing: -3px; }
    .rating { display: inline-block; margin-top: 8px; padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 15px; }
    .meta { margin-top: 12px; color: var(--muted); font-size: 13px; }
    .bar-wrap { margin: 22px 4px 6px; }
    .bar {
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #e53935 0%, #fb8c00 25%, #fdd835 50%, #9ccc65 75%, #43a047 100%);
      position: relative;
    }
    .needle {
      position: absolute;
      top: -6px;
      width: 4px;
      height: 24px;
      background: #fff;
      border-radius: 4px;
      transform: translateX(-50%);
      box-shadow: 0 0 0 3px rgba(11,16,32,.55);
    }
    .labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--muted); }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 16px; }
    .stat { background: #101628; border: 1px solid var(--line); border-radius: 14px; padding: 10px 8px; }
    .stat b { display: block; font-size: 18px; }
    .stat span { font-size: 11px; color: var(--muted); }
    canvas { width: 100%; height: 140px; margin-top: 18px; }
    .list { margin-top: 20px; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px;
      border-bottom: 1px solid #1d2540;
      font-size: 14px;
    }
    .row.active { background: #1c2744; margin: 0 -8px; padding-left: 12px; padding-right: 12px; border-radius: 10px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .err {
      margin-top: 20px;
      background: #3b1520;
      border: 1px solid #7a2a3a;
      color: #ffcdd2;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
    }
    .hint { margin-top: 18px; color: var(--muted); font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>CNN FEAR & GREED</h1>
        <div class="sub">날짜를 고르면 그날의 지수를 보여 드립니다</div>
      </div>
      <button id="reload" type="button">새로고침</button>
    </header>
    <div class="search">
      <div class="search-row">
        <input id="datePick" type="date" />
        <input id="dateText" type="search" inputmode="numeric" placeholder="예: 2024-03-15" />
      </div>
      <div class="actions">
        <button id="searchBtn" type="button">이 날짜 보기</button>
        <button id="todayBtn" type="button">최신 날짜</button>
      </div>
      <div class="note" id="note"></div>
    </div>
    <div id="app"></div>
  </div>
  <script>
    const CSV_URL = "https://raw.githubusercontent.com/whit3rabbit/fear-greed-data/main/fear-greed.csv";
    const MAP = {
      "extreme fear": { ko: "극단적 공포", color: "#e53935" },
      "fear": { ko: "공포", color: "#fb8c00" },
      "neutral": { ko: "중립", color: "#fdd835" },
      "greed": { ko: "탐욕", color: "#9ccc65" },
      "extreme greed": { ko: "극단적 탐욕", color: "#43a047" }
    };
    let ALL = [];
    let SELECTED = "";
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/).filter(Boolean);
      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const parts = lines[i].split(",");
        const date = (parts[0] || "").trim();
        const score = Number(parts[1]);
        const rating = (parts[2] || "").trim().toLowerCase();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !Number.isFinite(score)) continue;
        rows.push({ date, score, rating });
      }
      rows.sort((a, b) => a.date.localeCompare(b.date));
      return rows;
    }
    function fmt(n) { return Number.isFinite(n) ? Math.round(n) : "-"; }
    function pad(n) { return String(n).padStart(2, "0"); }
    function normalizeDate(raw) {
      if (!raw) return "";
      const s = String(raw).trim();
      let m = s.match(/^(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})$/);
      if (m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
      m = s.match(/^(\d{4})(\d{2})(\d{2})$/);
      if (m) return `${m[1]}-${m[2]}-${m[3]}`;
      m = s.match(/^(\d{2,4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일?$/);
      if (m) {
        const y = m[1].length === 2 ? "20" + m[1] : m[1];
        return `${y}-${pad(m[2])}-${pad(m[3])}`;
      }
      return "";
    }
    function findRow(date) {
      const exact = ALL.find(r => r.date === date);
      if (exact) return { row: exact, approx: false };
      const prev = [...ALL].reverse().find(r => r.date <= date);
      if (prev) return { row: prev, approx: true };
      return { row: ALL[0] || null, approx: true };
    }
    function drawChart(canvas, rows, markDate) {
      const dpr = window.devicePixelRatio || 1;
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, w, h);
      if (!rows.length) return;
      const padY = 8;
      const min = 0, max = 100;
      ctx.strokeStyle = "#2a3350";
      ctx.lineWidth = 1;
      [25, 50, 75].forEach(v => {
        const y = padY + (1 - (v - min) / (max - min)) * (h - padY * 2);
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      });
      ctx.beginPath();
      rows.forEach((r, i) => {
        const x = padY + (i / (rows.length - 1 || 1)) * (w - padY * 2);
        const y = padY + (1 - (r.score - min) / (max - min)) * (h - padY * 2);
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      });
      ctx.strokeStyle = "#8ab4ff";
      ctx.lineWidth = 2;
      ctx.stroke();
      const idx = rows.findIndex(r => r.date === markDate);
      if (idx >= 0) {
        const x = padY + (idx / (rows.length - 1 || 1)) * (w - padY * 2);
        const y = padY + (1 - (rows[idx].score - min) / (max - min)) * (h - padY * 2);
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    function render() {
      if (!ALL.length) return;
      const latest = ALL[ALL.length - 1];
      const wanted = SELECTED || latest.date;
      const found = findRow(wanted);
      const cur = found.row;
      const info = MAP[cur.rating] || { ko: cur.rating, color: "#9aa3b8" };
      const idx = ALL.findIndex(r => r.date === cur.date);
      const week = ALL.slice(Math.max(0, idx - 4), idx + 1);
      const month = ALL.slice(Math.max(0, idx - 21), idx + 1);
      const avg = arr => arr.reduce((s, r) => s + r.score, 0) / (arr.length || 1);
      const from = Math.max(0, idx - 14);
      const to = Math.min(ALL.length, idx + 16);
      const nearby = ALL.slice(from, to).reverse();
      const chartRows = ALL.slice(Math.max(0, idx - 89), idx + 1);
      const note = document.getElementById("note");
      if (found.approx && wanted !== cur.date) {
        note.textContent = `${wanted}에는 값이 없어, 가장 가까운 이전 거래일 ${cur.date}을 보여 드립니다. 주말·휴장일은 데이터가 없습니다.`;
      } else if (cur.date === latest.date) {
        note.textContent = `최신 데이터입니다. 범위: ${ALL[0].date} ~ ${latest.date}`;
      } else {
        note.textContent = `${cur.date} 데이터를 찾았습니다.`;
      }
      document.getElementById("datePick").value = cur.date;
      document.getElementById("dateText").value = wanted;
      document.getElementById("app").innerHTML = `
        <section class="hero">
          <div class="score" style="color:${info.color}">${fmt(cur.score)}</div>
          <div class="rating" style="background:${info.color}22;color:${info.color}">${info.ko}</div>
          <div class="meta">${cur.date} · 점수 ${cur.score.toFixed(1)}</div>
          <div class="bar-wrap">
            <div class="bar"><div class="needle" style="left:${Math.min(100, Math.max(0, cur.score))}%"></div></div>
            <div class="labels"><span>공포</span><span>중립</span><span>탐욕</span></div>
          </div>
          <div class="stats">
            <div class="stat"><span>직전 5일 평균</span><b>${fmt(avg(week))}</b></div>
            <div class="stat"><span>직전 22일 평균</span><b>${fmt(avg(month))}</b></div>
            <div class="stat"><span>전일 대비</span><b>${idx > 0 ? (cur.score - ALL[idx - 1].score >= 0 ? "+" : "") + (cur.score - ALL[idx - 1].score).toFixed(1) : "-"}</b></div>
          </div>
          <canvas id="chart"></canvas>
        </section>
        <section class="list">
          ${nearby.map(r => {
            const m = MAP[r.rating] || { ko: r.rating, color: "#9aa3b8" };
            const on = r.date === cur.date ? " active" : "";
            return `<div class="row${on}" data-date="${r.date}"><div><span class="dot" style="background:${m.color}"></span>${r.date}</div><div>${fmt(r.score)} · ${m.ko}</div></div>`;
          }).join("")}
        </section>
        <p class="hint">목록에서 날짜를 눌러도 됩니다. 원본은 GitHub CSV이며 평일 장 마감 후 갱신됩니다.</p>
      `;
      drawChart(document.getElementById("chart"), chartRows, cur.date);
      document.querySelectorAll(".row[data-date]").forEach(el => {
        el.addEventListener("click", () => {
          SELECTED = el.dataset.date;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }
    function searchDate() {
      const fromPick = document.getElementById("datePick").value;
      const fromText = normalizeDate(document.getElementById("dateText").value);
      const date = fromText || fromPick;
      if (!date) {
        document.getElementById("note").textContent = "날짜를 선택하거나 2024-03-15 형식으로 입력해 주세요.";
        return;
      }
      if (ALL.length && (date < ALL[0].date || date > ALL[ALL.length - 1].date)) {
        document.getElementById("note").textContent = `데이터가 ${ALL[0].date}부터 ${ALL[ALL.length - 1].date}까지입니다.`;
      }
      SELECTED = date;
      render();
    }
    async function load() {
      const app = document.getElementById("app");
      app.innerHTML = `<p class="hint">불러오는 중…</p>`;
      try {
        const res = await fetch(CSV_URL + "?t=" + Date.now());
        if (!res.ok) throw new Error("HTTP " + res.status);
        ALL = parseCSV(await res.text());
        if (!ALL.length) throw new Error("데이터가 비어 있습니다.");
        const last = ALL[ALL.length - 1].date;
        document.getElementById("datePick").min = ALL[0].date;
        document.getElementById("datePick").max = last;
        if (!SELECTED) SELECTED = last;
        render();
      } catch (e) {
        app.innerHTML = `<div class="err">데이터를 불러오지 못했습니다. 이 파일은 웹 주소로 열어 주세요.<br><br>${e.message}</div>`;
      }
    }
    document.getElementById("reload").addEventListener("click", load);
    document.getElementById("searchBtn").addEventListener("click", searchDate);
    document.getElementById("todayBtn").addEventListener("click", () => {
      SELECTED = ALL.length ? ALL[ALL.length - 1].date : "";
      render();
    });
    document.getElementById("datePick").addEventListener("change", () => {
      document.getElementById("dateText").value = document.getElementById("datePick").value;
      searchDate();
    });
    document.getElementById("dateText").addEventListener("keydown", e => {
      if (e.key === "Enter") searchDate();
    });
    load();
  </script>
</body>
</html>
