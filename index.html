<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fear & Greed" />
  <link rel="manifest" href="manifest.json" />
  <title>CNN Fear & Greed + QQQ</title>
  <style>
    :root { --bg:#0b1020; --card:#151b2e; --line:#2a3350; --text:#f4f6fb; --muted:#9aa3b8; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif; min-height:100%; }
    body { padding: calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
    .wrap { max-width:560px; margin:0 auto; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
    h1 { font-size:15px; font-weight:600; margin:0; color:var(--muted); }
    .sub { font-size:12px; color:var(--muted); margin-top:4px; }
    button { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:999px; padding:8px 14px; font-size:13px; font-weight:600; }
    .search { margin-top:16px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px; }
    .search-row { display:flex; gap:8px; }
    .search input[type=date], .search input[type=search] { flex:1; min-width:0; background:#101628; border:1px solid var(--line); color:var(--text); border-radius:12px; padding:11px 12px; font-size:16px; }
    .search .actions { display:flex; gap:8px; margin-top:8px; }
    .search .actions button { flex:1; }
    .note { margin-top:8px; font-size:12px; color:var(--muted); min-height:16px; }
    .hero { margin-top:16px; background:linear-gradient(180deg,#1a2238 0%,var(--card) 100%); border:1px solid var(--line); border-radius:24px; padding:22px 20px 18px; text-align:center; }
    .score { font-size:84px; line-height:1; font-weight:800; letter-spacing:-3px; }
    .rating { display:inline-block; margin-top:8px; padding:6px 12px; border-radius:999px; font-weight:700; font-size:15px; }
    .meta { margin-top:12px; color:var(--muted); font-size:13px; }
    .bar-wrap { margin:22px 4px 6px; }
    .bar { height:12px; border-radius:999px; background:linear-gradient(90deg,#e53935 0%,#fb8c00 25%,#fdd835 50%,#9ccc65 75%,#43a047 100%); position:relative; }
    .needle { position:absolute; top:-6px; width:4px; height:24px; background:#fff; border-radius:4px; transform:translateX(-50%); box-shadow:0 0 0 3px rgba(11,16,32,.55); }
    .labels { display:flex; justify-content:space-between; margin-top:8px; font-size:11px; color:var(--muted); }
    .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:16px; }
    .stat { background:#101628; border:1px solid var(--line); border-radius:14px; padding:10px 8px; }
    .stat b { display:block; font-size:18px; }
    .stat span { font-size:11px; color:var(--muted); }
    canvas { width:100%; height:140px; margin-top:18px; }
    .list { margin-top:20px; }
    .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 4px; border-bottom:1px solid #1d2540; font-size:14px; }
    .row.active { background:#1c2744; margin:0 -8px; padding-left:12px; padding-right:12px; border-radius:10px; }
    .qqq-line { margin-top:4px; font-size:12px; color:var(--muted); }
    .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:8px; }
    .err { margin-top:20px; background:#3b1520; border:1px solid #7a2a3a; color:#ffcdd2; padding:14px; border-radius:14px; font-size:14px; }
    .hint { margin-top:18px; color:var(--muted); font-size:12px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>FEAR & GREED + QQQ</h1>
        <div class="sub">날짜별 지수 · QQQ 종가 · RSI(14)</div>
      </div>
      <button id="reload" type="button">새로고침</button>
    </header>
    <div class="search">
      <div class="search-row">
        <input id="datePick" type="date" />
        <input id="dateText" type="search" inputmode="numeric" placeholder="예: 2024-03-15" />
      </div>
      <div class="actions">
        <button id="searchBtn" type="button">이 날짜 보기</button>
        <button id="todayBtn" type="button">최신 날짜</button>
      </div>
      <div class="note" id="note"></div>
    </div>
    <div id="app"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/gh/NinetysevenD11/fear-greed-app@main/app.js"></script>
</body>
</html>
