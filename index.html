<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f4f6" />
  <title>CNN Fear & Greed + QQQ</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
  <style>
    :root {
      --bg: #f2f4f6;
      --card: #ffffff;
      --line: #e5e8eb;
      --text: #191f28;
      --muted: #8b95a1;
      --blue: #3182f6;
      --blue-soft: #e8f3ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    body {
      padding: calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.04em;
      color: var(--text);
    }
    .sub { margin-top: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
    button {
      border: 0;
      background: #e8eaed;
      color: #333d4b;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
    }
    button:active { transform: scale(.98); opacity: .88; }
    .search {
      margin-top: 16px;
      background: var(--card);
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .search-row { display: flex; gap: 8px; }
    .search input[type=date],
    .search input[type=search] {
      flex: 1; min-width: 0;
      background: #f2f4f6;
      border: 0;
      color: var(--text);
      border-radius: 12px;
      padding: 12px 12px;
      font-size: 16px;
      font-family: inherit;
      font-weight: 600;
    }
    .search input::placeholder { color: #b0b8c1; font-weight: 500; }
    .search .actions { display: flex; gap: 8px; margin-top: 8px; }
    .search .actions button { flex: 1; }
    #searchBtn {
      background: var(--blue);
      color: #fff;
    }
    #todayBtn, #reload {
      background: #e8eaed;
      color: #333d4b;
    }
    .note { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 16px; font-weight: 500; }
    .hero {
      margin-top: 12px;
      background: var(--card);
      border-radius: 24px;
      padding: 28px 20px 18px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .score {
      font-size: 88px;
      line-height: .9;
      font-weight: 800;
      letter-spacing: -.06em;
    }
    .rating {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .meta { margin-top: 10px; color: var(--muted); font-size: 14px; font-weight: 500; }
    .bar-wrap { margin: 22px 4px 6px; }
    .bar {
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #f04452 0%, #ff8a3d 28%, #f2c94c 50%, #20c997 76%, #3182f6 100%);
      position: relative;
    }
    .needle {
      position: absolute;
      top: -6px;
      width: 4px;
      height: 22px;
      background: #191f28;
      border-radius: 4px;
      transform: translateX(-50%);
      box-shadow: 0 0 0 3px #fff;
    }
    .labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--muted); font-weight: 600; }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 16px; }
    .stat {
      background: #f2f4f6;
      border-radius: 14px;
      padding: 12px 8px;
    }
    .stat b { display: block; font-size: 17px; margin-top: 4px; font-weight: 800; letter-spacing: -.03em; }
    .stat span { font-size: 11px; color: var(--muted); font-weight: 600; }
    canvas { width: 100%; height: 140px; margin-top: 16px; }
    .list {
      margin-top: 12px;
      background: var(--card);
      border-radius: 20px;
      padding: 6px 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 14px 4px;
      border-bottom: 1px solid #f2f4f6;
      font-size: 15px;
      font-weight: 600;
    }
    .row:last-child { border-bottom: 0; }
    .row.active {
      background: var(--blue-soft);
      margin: 0 -8px;
      padding-left: 12px;
      padding-right: 12px;
      border-radius: 14px;
      border-bottom-color: transparent;
    }
    .qqq-line { margin-top: 3px; font-size: 13px; color: var(--muted); font-weight: 500; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .err {
      margin-top: 16px;
      background: #fff0f1;
      color: #de0713;
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 600;
    }
    .hint { margin-top: 16px; color: var(--muted); font-size: 13px; line-height: 1.55; font-weight: 500; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>공포탐욕 + QQQ</h1>
        <div class="sub">날짜별 지수 · 종가 · RSI</div>
      </div>
      <button id="reload" type="button">새로고침</button>
    </header>
    <div class="search">
      <div class="search-row">
        <input id="datePick" type="date" />
        <input id="dateText" type="search" inputmode="numeric" placeholder="예: 2024-03-15" />
      </div>
      <div class="actions">
        <button id="searchBtn" type="button">이 날짜 보기</button>
        <button id="todayBtn" type="button">최신 날짜</button>
      </div>
      <div class="note" id="note"></div>
    </div>
    <div id="app"><p class="hint">불러오는 중…</p></div>
  </div>
  <script src="https://raw.githubusercontent.com/NinetysevenD11/fear-greed-app/main/app.js"></script>
</body>
</html>
